[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bevflow"
version = "0.1.0"
description = "Class-agnostic BEV motion prediction: MotionNet, PriorMotion, LEGO-Motion on one pipeline"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "opencv-python-headless",
    "Pillow",
    "pyquaternion",
    "tqdm",
    "numba",
    "pyyaml",
    "tensorboard",
]

[tool.setuptools.packages.find]
include = ["bevflow*"]

# 注：nuscenes-devkit 不装 pip 版；数据工具依赖上游 vendored 子集（third_party/，不随包发布），
# 见 README 的数据准备一节。ref/、third_party/、docs/setup 不参与发布。
